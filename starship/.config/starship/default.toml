"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "jason"

format = """
$os \
$username\
$directory\
$git_branch\
$git_status\
$status """

right_format = """
$dotnet\
$nodejs\
$golang\
$julia\
$python\
$rust\
$shell\
$time"""

continuation_prompt = "[](yellow)[ > ](fg:black bg:yellow)[](yellow) "

[palettes.jason]
black = "#262B44"
blue = "#4B95E9"
green = "#59C9A5"
orange = "#F07623"
red = "#D81E5B"
white = "#E0DEF4"
yellow = "#F3AE35"
cyan = "#00FFFF"
purple = "#8800DD"

# ─────────────────────────────────────────────────────────────
# Operating system
# ─────────────────────────────────────────────────────────────

[os]
disabled = false
style = "fg:cyan"
format = "[$symbol ]($style)"

[os.symbols]
Windows = ""
Macos = ""
Linux = ""
Ubuntu = ""
Debian = ""
Fedora = ""
Arch = ""

# ─────────────────────────────────────────────────────────────
# User
# ─────────────────────────────────────────────────────────────

[username]
show_always = true
style_user = "fg:black bg:yellow"
style_root = "fg:white bg:red"
format = "[](fg:yellow)[ $user ]($style)[](fg:yellow)"

# ─────────────────────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────────────────────

[directory]
style = "fg:white bg:orange"
format = "[](fg:black bg:orange)[  $path ]($style)[](fg:orange)"
truncation_length = 3
truncate_to_repo = false
read_only = " "
home_symbol = "~"

# ─────────────────────────────────────────────────────────────
# Git
# ─────────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:black bg:green"
format = "[](fg:black bg:green)[ $symbol$branch ]($style)"
truncation_length = 25
truncation_symbol = "…"

[git_status]
style = "fg:black bg:green"
format = "[$all_status$ahead_behind ]($style)[](fg:green)"

conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "${count} "
modified = "${count} "
staged = "${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ─────────────────────────────────────────────────────────────
# Command status
# ─────────────────────────────────────────────────────────────

[status]
disabled = false

# Failure uses a red icon on the same blue background so that the
# transition remains seamless.
style = "fg:red bg:blue"
success_style = "fg:white bg:blue"

symbol = ""
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = ""
signal_symbol = "⚡"

format = "[](fg:black bg:blue)[ $symbol ]($style)[](fg:blue)"

# ─────────────────────────────────────────────────────────────
# Input prompt
# ─────────────────────────────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ─────────────────────────────────────────────────────────────
# Right prompt
# ─────────────────────────────────────────────────────────────

[dotnet]
symbol = " "
style = "cyan"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = " "
style = "green"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "blue"
format = "[ $symbol$version ]($style)"

[julia]
symbol = " "
style = "#9558B2"
format = "[ $symbol$version ]($style)"

[python]
symbol = " "
style = "yellow"
format = "[ $symbol$version( \\($virtualenv\\)) ]($style)"

[rust]
symbol = "🦀 "
style = "#CE422B"
format = "[ $symbol$version ]($style)"

[shell]
disabled = false
nu_indicator = "nu"
style = "blue bold"
format = "[in $indicator]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "blue bold"
format = "[at $time]($style)"
