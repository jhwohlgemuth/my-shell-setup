"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "jason"

format = """
[╭─](fg:gray)\
$os\
$username\
$directory\
${custom.directory_end}\
$git_branch\
$git_status\
$status\
$fill\
$dotnet\
$nodejs\
$golang\
$julia\
$python\
$rust\
$shell\
$time
[╰─](fg:gray) """

right_format = ""

continuation_prompt = "[](yellow)[>](fg:black bg:yellow)[](yellow) "

[palettes.jason]
black = "#262B44"
blue = "#4B95E9"
green = "#59C9A5"
gray = "#939594"
orange = "#F07623"
red = "#D81E5B"
white = "#E0DEF4"
yellow = "#F3AE35"
cyan = "#00FFFF"
purple = "#8800DD"
os_text = "#262B44"
username_text = "#262B44"
root_text = "#E0DEF4"
directory_bg = "#4B95E9"
directory_text = "#262B44"
git_text = "#262B44"
status_text = "#E0DEF4"
status_error_text = "#FFFFFF"

[palettes.one_dark]
black = "#282C34"
blue = "#61AFEF"
green = "#98C379"
gray = "#5C6370"
orange = "#D19A66"
red = "#E06C75"
white = "#ABB2BF"
yellow = "#E5C07B"
cyan = "#56B6C2"
purple = "#C678DD"
os_text = "#282C34"
username_text = "#282C34"
root_text = "#282C34"
directory_bg = "#61AFEF"
directory_text = "#282C34"
git_text = "#282C34"
status_text = "#282C34"
status_error_text = "#FFFFFF"

[palettes.ornl]
black = "#373A36"
blue = "#006BA6"
green = "#00662C"
gray = "#DBDCDB"
orange = "#FF9E1B"
red = "#FE5000"
white = "#FFFFFF"
yellow = "#7DBA00"
cyan = "#00BDB5"
purple = "#4E008E"
ornl_green = "#00662C"
hale_navy = "#00454D"
dark_matter = "#373A36"
graphite = "#DBDCDB"
polar = "#FFFFFF"
energy = "#7DBA00"
mist = "#8BFEBF"
biome = "#00B38F"
aqua = "#00BDB5"
infinity = "#006BA6"
hydro = "#005776"
forge = "#FF9E1B"
spark = "#FE5000"
plasma = "#B50094"
pulsar = "#4E008E"
os_text = "#373A36"
username_text = "#373A36"
root_text = "#FFFFFF"
directory_bg = "#005776"
directory_text = "#8BFEBF"
git_text = "#FFFFFF"
status_text = "#FFFFFF"
status_error_text = "#FFFFFF"

[fill]
symbol = "·"
style = "fg:gray"

# ─────────────────────────────────────────────────────────────
# Operating system
# ─────────────────────────────────────────────────────────────

[os]
disabled = false
style = "fg:os_text bg:white"
format = "[](fg:white)[$symbol ]($style)[](fg:white)"

[os.symbols]
Windows = ""
Macos = ""
Linux = ""
Ubuntu = ""
Debian = ""
Fedora = ""
Arch = ""

# ─────────────────────────────────────────────────────────────
# User
# ─────────────────────────────────────────────────────────────

[username]
show_always = true
style_user = "fg:username_text bg:yellow"
style_root = "fg:root_text bg:red"
format = "[](fg:black bg:yellow)[ $user ]($style)[](fg:yellow)"

# ─────────────────────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────────────────────

[directory]
style = "fg:directory_text bg:directory_bg"
format = "[](fg:black bg:directory_bg)[  $path ]($style)"
truncation_length = 3
truncate_to_repo = false
read_only = " "
home_symbol = "~"

[custom.directory_end]
description = "Close the directory segment outside Git repositories"
shell = ["nu", "-c"]
when = """
let result = (do {
    git rev-parse --is-inside-work-tree
} | complete)

if $result.exit_code == 0 {
    exit 1
} else {
    exit 0
}
"""
command = "''"
style = "fg:directory_bg"
format = "[]($style)"

# ─────────────────────────────────────────────────────────────
# Git
# ─────────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:git_text bg:green"
format = "[](fg:directory_bg bg:green)[ $symbol $branch ]($style)"
truncation_length = 25
truncation_symbol = "…"

[git_status]
style = "fg:git_text bg:green"
format = "[$all_status$ahead_behind ]($style)[](fg:green)"

conflicted = "= ${count} "
ahead = "⇡ ${count} "
behind = "⇣ ${count} "
diverged = "⇕ ⇡ ${ahead_count} ⇣ ${behind_count} "
untracked = "? ${count} "
stashed = " ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = "» ${count} "
deleted = "✘ ${count} "

# ─────────────────────────────────────────────────────────────
# Command status
# ─────────────────────────────────────────────────────────────

[status]
disabled = false

# Failure uses a red icon on the same blue background so that the
# transition remains seamless.
style = "fg:status_error_text bg:red"
success_style = "fg:status_text bg:blue"
failure_style = "fg:status_error_text bg:red"

symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
success_symbol = "[](fg:black bg:blue)[  ](fg:status_text bg:blue)[](fg:blue)"
not_executable_symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
not_found_symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
sigint_symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
signal_symbol = "[](fg:black bg:red)[ ⚡ ](fg:status_error_text bg:red)[](fg:red)"

format = "$symbol"

# ─────────────────────────────────────────────────────────────
# Input prompt
# ─────────────────────────────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ─────────────────────────────────────────────────────────────
# Right prompt
# ─────────────────────────────────────────────────────────────

[dotnet]
symbol = " "
style = "cyan"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = " "
style = "green"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "blue"
format = "[ $symbol$version ]($style)"

[julia]
symbol = " "
style = "#9558B2"
format = "[ $symbol$version ]($style)"

[python]
symbol = " "
style = "yellow"
format = "[ $symbol$version( \\($virtualenv\\)) ]($style)"

[rust]
symbol = "🦀 "
style = "#CE422B"
format = "[ $symbol$version ]($style)"

[shell]
disabled = false
nu_indicator = "nu"
style = "blue bold"
format = "[in $indicator]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "blue bold"
format = "[at $time]($style)"
