pulsar = "#4E008E"
os_text = "#373A36"
username_text = "#373A36"
root_text = "#FFFFFF"
directory_bg = "#005776"
directory_text = "#8BFEBF"
git_text = "#FFFFFF"
git_dirty_bg = "#8BFEBF"
git_dirty_text = "#373A36"
status_text = "#FFFFFF"
status_error_text = "#FFFFFF"

[fill]
symbol = "·"
style = "fg:gray"

# ─────────────────────────────────────────────────────────────
# Operating system
# ─────────────────────────────────────────────────────────────

[os]
disabled = false
style = "fg:os_text bg:white"
format = "[](fg:white)[$symbol ]($style)[](fg:white)"

[os.symbols]
Windows = ""
Macos = ""
Linux = ""
Ubuntu = ""
Debian = ""
Fedora = ""
Arch = ""

# ─────────────────────────────────────────────────────────────
# User
# ─────────────────────────────────────────────────────────────

[username]
show_always = true
style_user = "fg:username_text bg:yellow"
style_root = "fg:root_text bg:red"
format = "[](fg:black bg:yellow)[ $user ]($style)[](fg:yellow)"

# ─────────────────────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────────────────────

[directory]
style = "bold fg:directory_text bg:directory_bg"
format = "[](fg:black bg:directory_bg)[  $path ]($style)"
truncation_length = 3
truncate_to_repo = false
read_only = " "
home_symbol = "~"

[custom.directory_end]
description = "Close the directory segment outside Git repositories"
shell = ["nu", "-c"]
when = """
let result = (do {
    git rev-parse --is-inside-work-tree
} | complete)

if $result.exit_code == 0 {
    exit 1
} else {
    exit 0
}
"""
command = "''"
style = "fg:directory_bg"
format = "[]($style)"

[custom.git_clean]
description = "Render a green Git segment for clean repositories"
shell = ["nu", "-c"]
when = """
let result = (do {
    git status --porcelain
} | complete)

if $result.exit_code == 0 and ($result.stdout | str trim | str length) == 0 {
    exit 0
} else {
    exit 1
}
"""
command = """
let lines = (git status --porcelain=v1 --branch | lines)
let header = ($lines | first)
let branch = (
    $header
    | str replace --regex '^## (No commits yet on |Initial commit on )?' ''
    | split row '...'
    | first
    | split row ' '
    | first
)
let changes = ($lines | skip 1)
let conflict_pattern = '^(DD|AU|UD|UA|DU|AA|UU)'
let conflicted = ($changes | where { |line| $line =~ $conflict_pattern } | length)
let staged = ($changes | where { |line|
    ($line =~ '^[MAC]') and not ($line =~ $conflict_pattern)
} | length)
let modified = ($changes | where { |line|
    ($line =~ '^.M') and not ($line =~ $conflict_pattern)
} | length)
let renamed = ($changes | where { |line| $line =~ '^(R.|.R)' } | length)
let deleted = ($changes | where { |line| $line =~ '^(D.|.D)' } | length)
let untracked = ($changes | where { |line| $line =~ '^\\?\\?' } | length)
let stashed = (git stash list | lines | length)
let ahead_rows = ($header | parse -r 'ahead (?<count>\\d+)')
let behind_rows = ($header | parse -r 'behind (?<count>\\d+)')
let ahead = if ($ahead_rows | is-empty) { 0 } else {
    $ahead_rows.0.count | into int
}
let behind = if ($behind_rows | is-empty) { 0 } else {
    $behind_rows.0.count | into int
}

mut parts = [$" ($branch)"]
if $conflicted > 0 { $parts = ($parts | append $"= ($conflicted)") }
if $staged > 0 { $parts = ($parts | append $" ($staged)") }
if $modified > 0 { $parts = ($parts | append $" ($modified)") }
if $renamed > 0 { $parts = ($parts | append $"» ($renamed)") }
if $deleted > 0 { $parts = ($parts | append $"✘ ($deleted)") }
if $untracked > 0 { $parts = ($parts | append $"? ($untracked)") }
if $stashed > 0 { $parts = ($parts | append $" ($stashed)") }
if $ahead > 0 { $parts = ($parts | append $"⇡ ($ahead)") }
if $behind > 0 { $parts = ($parts | append $"⇣ ($behind)") }
$parts | str join ' '
"""
style = "fg:git_text bg:green"
format = "[](fg:directory_bg bg:green)[ $output ]($style)[](fg:green)"

[custom.git_dirty]
description = "Render a contrasting Git segment for dirty repositories"
shell = ["nu", "-c"]
when = """
let result = (do {
    git status --porcelain
} | complete)

if $result.exit_code == 0 and ($result.stdout | str trim | str length) > 0 {
    exit 0
} else {
    exit 1
}
"""
command = """
let lines = (git status --porcelain=v1 --branch | lines)
let header = ($lines | first)
let branch = (
    $header
    | str replace --regex '^## (No commits yet on |Initial commit on )?' ''
    | split row '...'
    | first
    | split row ' '
    | first
)
let changes = ($lines | skip 1)
let conflict_pattern = '^(DD|AU|UD|UA|DU|AA|UU)'
let conflicted = ($changes | where { |line| $line =~ $conflict_pattern } | length)
let staged = ($changes | where { |line|
    ($line =~ '^[MAC]') and not ($line =~ $conflict_pattern)
} | length)
let modified = ($changes | where { |line|
    ($line =~ '^.M') and not ($line =~ $conflict_pattern)
} | length)
let renamed = ($changes | where { |line| $line =~ '^(R.|.R)' } | length)
let deleted = ($changes | where { |line| $line =~ '^(D.|.D)' } | length)
let untracked = ($changes | where { |line| $line =~ '^\\?\\?' } | length)
let stashed = (git stash list | lines | length)
let ahead_rows = ($header | parse -r 'ahead (?<count>\\d+)')
let behind_rows = ($header | parse -r 'behind (?<count>\\d+)')
let ahead = if ($ahead_rows | is-empty) { 0 } else {
    $ahead_rows.0.count | into int
}
let behind = if ($behind_rows | is-empty) { 0 } else {
    $behind_rows.0.count | into int
}

mut parts = [$" ($branch)"]
if $conflicted > 0 { $parts = ($parts | append $"= ($conflicted)") }
if $staged > 0 { $parts = ($parts | append $" ($staged)") }
if $modified > 0 { $parts = ($parts | append $" ($modified)") }
if $renamed > 0 { $parts = ($parts | append $"» ($renamed)") }
if $deleted > 0 { $parts = ($parts | append $"✘ ($deleted)") }
if $untracked > 0 { $parts = ($parts | append $"? ($untracked)") }
if $stashed > 0 { $parts = ($parts | append $" ($stashed)") }
if $ahead > 0 { $parts = ($parts | append $"⇡ ($ahead)") }
if $behind > 0 { $parts = ($parts | append $"⇣ ($behind)") }
$parts | str join ' '
"""
style = "fg:git_dirty_text bg:git_dirty_bg"
format = "[](fg:directory_bg bg:git_dirty_bg)[ $output ]($style)[](fg:git_dirty_bg)"

# ─────────────────────────────────────────────────────────────
# Git
# ─────────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:git_text"
format = "[$symbol $branch]($style)"
truncation_length = 25
truncation_symbol = "…"

[git_status]
style = "fg:git_text"
format = "[$all_status$ahead_behind]($style)"

conflicted = "= ${count} "
ahead = "⇡ ${count} "
behind = "⇣ ${count} "
diverged = "⇕ ⇡ ${ahead_count} ⇣ ${behind_count} "
untracked = "? ${count} "
stashed = " ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = "» ${count} "
deleted = "✘ ${count} "

# ─────────────────────────────────────────────────────────────
# Command status
# ─────────────────────────────────────────────────────────────

[status]
disabled = false

# Failure uses a red icon on the same blue background so that the
# transition remains seamless.
style = "fg:status_error_text bg:red"
success_style = "fg:status_text bg:blue"
failure_style = "fg:status_error_text bg:red"

symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
success_symbol = "[](fg:black bg:blue)[  ](fg:status_text bg:blue)[](fg:blue)"
not_executable_symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
not_found_symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
sigint_symbol = "[](fg:black bg:red)[  ](fg:status_error_text bg:red)[](fg:red)"
signal_symbol = "[](fg:black bg:red)[ ⚡ ](fg:status_error_text bg:red)[](fg:red)"

format = "$symbol"

# ─────────────────────────────────────────────────────────────
# Input prompt
# ─────────────────────────────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# ─────────────────────────────────────────────────────────────
# Right prompt
# ─────────────────────────────────────────────────────────────

[dotnet]
symbol = " "
style = "cyan"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = " "
style = "green"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "blue"
format = "[ $symbol$version ]($style)"

[julia]
symbol = " "
style = "#9558B2"
format = "[ $symbol$version ]($style)"

[python]
symbol = " "
style = "yellow"
format = "[ $symbol$version( \\($virtualenv\\)) ]($style)"

[rust]
symbol = "🦀 "
style = "#CE422B"
format = "[ $symbol$version ]($style)"

[shell]
disabled = false
nu_indicator = "nu"
style = "blue bold"
format = "[in $indicator]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
style = "blue bold"
format = "[at $time]($style)"
