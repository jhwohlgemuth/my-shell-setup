os_text = "#282C34"
username_text = "#282C34"
root_text = "#282C34"
directory_bg = "#61AFEF"
directory_text = "#282C34"
git_text = "#282C34"
git_dirty_bg = "#E5C07B"
git_dirty_text = "#282C34"
status_text = "#282C34"
status_error_text = "#FFFFFF"

[palettes.ornl]
black = "#373A36"
blue = "#006BA6"
green = "#00662C"
gray = "#DBDCDB"
orange = "#FF9E1B"
red = "#FE5000"
white = "#FFFFFF"
yellow = "#7DBA00"
cyan = "#00BDB5"
purple = "#4E008E"
ornl_green = "#00662C"
hale_navy = "#00454D"
dark_matter = "#373A36"
graphite = "#DBDCDB"
polar = "#FFFFFF"
energy = "#7DBA00"
mist = "#8BFEBF"
biome = "#00B38F"
aqua = "#00BDB5"
infinity = "#006BA6"
hydro = "#005776"
forge = "#FF9E1B"
spark = "#FE5000"
