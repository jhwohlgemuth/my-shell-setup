"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "jason"
scan_timeout = 1000
command_timeout = 5000

format = """
[╭─](fg:gray)\
$os\
$username\
$directory\
${custom.directory_end}\
${custom.git_clean}\
${custom.git_dirty}\
$status\
$fill\
$dotnet\
$nodejs\
$golang\
$julia\
$python\
$rust\
$shell\
$time
[╰─](fg:gray) """

right_format = ""

continuation_prompt = "[](yellow)[>](fg:black bg:yellow)[](yellow) "

