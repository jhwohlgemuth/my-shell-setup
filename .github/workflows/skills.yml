name: Agent skill checks

"on":
  push:
    paths:
      - "agents/**"
      - "mise.toml"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "agents/**"
      - "mise.toml"
      - ".github/workflows/skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out previous skill baseline
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: .coverage-baseline
      - name: Install GNU Stow
        run: |
          if ! command -v stow >/dev/null || ! command -v dos2unix >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes stow dos2unix
          fi
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
      - name: Verify Stow runtime inventory
        run: make -C agents stow-check
      - name: Test skill tooling
        run: mise exec -- python3 -m unittest discover -s agents/scripts -p 'test_*.py'
      - name: Check every installed skill offline
        env:
          WAZA_NO_UPDATE_CHECK: "1"
        run: make -C agents ci
      - name: Report capability coverage change
        if: always()
        shell: bash
        env:
          WAZA_NO_UPDATE_CHECK: "1"
        run: |
          previous=()
          if [[ -f .coverage-baseline/agents/coverage/capabilities.json ]]; then
            mise exec -- python3 agents/scripts/skill_coverage.py \
              --repo-root .coverage-baseline --waza waza \
              --json-out "$RUNNER_TEMP/skill-coverage-previous.json" > /dev/null
            previous=(--previous "$RUNNER_TEMP/skill-coverage-previous.json")
          fi
          set +e
          mise exec -- python3 agents/scripts/skill_coverage.py \
            --waza waza --strict \
            --json-out "$RUNNER_TEMP/skill-coverage-current.json" \
            "${previous[@]}" > "$RUNNER_TEMP/skill-coverage.md"
          status=$?
          cat "$RUNNER_TEMP/skill-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Save capability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-capability-coverage
          path: |
            ${{ runner.temp }}/skill-coverage.md
            ${{ runner.temp }}/skill-coverage-current.json
            ${{ runner.temp }}/skill-coverage-previous.json
