name: Repository checks

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
      - name: Install Stow
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes stow
      - name: Install Nushell
        run: mise use --global nu@0.116.1
      - name: Run repository checks
        run: make check
