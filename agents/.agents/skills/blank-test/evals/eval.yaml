name: blank-test-eval
description: Credential-free harness smoke test for the blank-test skill.
skill: blank-test
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 30
  parallel: false
  executor: mock
  model: mock

metrics:
  - name: task_completion
    weight: 1
    threshold: 1

graders:
  - type: text
    name: smoke_prompt_visible
    config:
      regex_match:
        - "(?i)blank test skill"

tasks:
  - "tasks/smoke.yaml"
  - "tasks/unrelated-testing.yaml"
