id: guidelines-rust-routing-review-001
name: Invoke guidelines-rust for code review
description: The original skill explicitly applies to reviewing code.
inputs:
  prompt: "Review this Rust function for unnecessary mutable state and functional clarity. Do not edit it."
expected:
  should_trigger: true
graders:
