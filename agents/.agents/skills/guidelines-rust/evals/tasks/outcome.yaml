id: guidelines-rust-functional-style-001
name: Favor a small pure Rust function
description: The original guidance favors immutability, composability, and purity.
inputs:
  prompt: |
    Write only `fn count_nonempty(lines: &[&str]) -> usize`. Count nonempty strings without changing the input. Prefer the functional style described by guidelines-rust.
graders:
  - type: code
    name: immutable_pure_count
    config:
      assertions:
        - "'fn count_nonempty' in output"
        - "'.iter()' in output"
        - "'.filter(' in output"
        - "'.count()' in output"
        - "'let mut' not in output"
