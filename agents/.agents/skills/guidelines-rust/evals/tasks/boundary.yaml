id: guidelines-rust-error-handling-001
name: Preserve the original Rust error-handling rule
description: The source skill asks the agent to avoid adding question-mark propagation.
inputs:
  prompt: |
    Write only `fn parse_id(text: &str) -> Result<u32, std::num::ParseIntError>` using guidelines-rust. Return a parse error for invalid input. Do not add the `?` operator.
graders:
  - type: code
    name: no_question_mark
    config:
      assertions:
        - "'fn parse_id' in output"
        - "'Result<' in output"
        - "'.parse' in output"
        - "'?' not in output"
