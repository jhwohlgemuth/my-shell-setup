id: guidelines-rust-error-handling-001
name: Handle two fallible Rust parses
description: Measure whether the skill changes error handling without repeating its rule in the prompt.
inputs:
  prompt: |
    Write only `fn parse_pair(left: &str, right: &str) -> Result<(u32, u32), std::num::ParseIntError>`. Parse both values and return the parse error if either is invalid.
graders:
  - type: program
    name: handles_both_errors_without_question_mark
    config:
      command: python3
      args: [scripts/grade_rust_parse_pair.py]
      timeout: 60
