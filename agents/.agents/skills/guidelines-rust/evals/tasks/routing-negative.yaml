id: guidelines-rust-routing-negative-001
name: Keep guidelines-rust out of an unrelated request
description: Observe the negative routing boundary without injecting the skill body.
inputs:
  prompt: "Review this existing Rust pull request only; list findings and do not modify code."
expected:
  should_trigger: false
graders:
  - type: skill_invocation
    name: avoids_guidelines_rust
    config:
      forbidden_skills: [guidelines-rust]
