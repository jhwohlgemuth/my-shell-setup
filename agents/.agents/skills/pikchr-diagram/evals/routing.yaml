name: pikchr-diagram-routing
description: Model-backed positive and negative skill invocation checks.
skill: pikchr-diagram
schemaVersion: "1.0"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 180
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
  skill_directories: [".."]
  inject_skill_body: false
  trigger_skill_routing: true

metrics:
  - name: task_completion
    weight: 1
    threshold: 1

tasks:
  - tasks/routing-positive.yaml
  - tasks/routing-negative.yaml
