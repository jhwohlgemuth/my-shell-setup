name: rust-review-harness
description: Credential-free task loading and grader plumbing; not behavioral evidence.
skill: rust-review
schemaVersion: "1.0"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 30
  parallel: false
  executor: mock
  model: mock

metrics:
  - name: task_completion
    weight: 1
    threshold: 1

graders:
  - type: text
    name: mock_prompt_echo
    config:
      contains:
        - "rust-review"

tasks:
  - tasks/mock-description.yaml
  - tasks/mock-positive.yaml
  - tasks/mock-negative.yaml
