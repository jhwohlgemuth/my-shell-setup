id: rust-review-panic-001
name: Identify a reachable panic with a located fix
description: Review a fallible Rust path without rewriting the source.
inputs:
  prompt: |
    Review only this Rust code. Treat it as parse.rs lines 1-3. Return a prioritized review with location, consequence, and a short fix; do not edit files.

    1  pub fn parse_id(text: &str) -> u32 {
    2      text.parse::<u32>().unwrap()
    3  }
graders:
  - type: text
    name: located_panic_finding
    config:
      regex_match:
        - "(?i)parse.rs:2"
        - "(?i)(panic|unwrap)"
        - "(?i)(fix|result|error)"
  - type: tool_constraint
    name: no_review_side_effects
    config:
      allow_only: []
